# Inflexion backend on a VM (Oracle Cloud free tier, or any Docker host).
#
# Caddy terminates TLS (automatic Let's Encrypt) and reverse-proxies to the combined
# API + engine backend. The dApp is HTTPS, so the backend MUST be HTTPS too (browsers
# block mixed content) — that's what Caddy provides, for free, with auto-renewing certs.
#
# Telemetry (Signals 2 & 4) persists in ./data (bind mount) across restarts.
#
# Setup: create a `.env` at the repo root (see .env.example) with at least
#   SUBGRAPH_URL, ARBITRUM_SEPOLIA_RPC, BACKEND_DOMAIN
# then:  docker compose up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: '8088'
      DEMAND_LOG: /data/demand.jsonl
      COMPETITION_LOG: /data/competition.jsonl
    volumes:
      - ./data:/data
    expose:
      - '8088'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    volumes:
      - ./apps/backend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
