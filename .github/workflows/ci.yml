name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable pnpm via corepack
        # Corepack ships with Node 20+, reads pnpm version from the `packageManager`
        # field in package.json. No third-party action dependency → more stable than
        # pnpm/action-setup (which intermittently fails on codeload.github.com SHA fetch).
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm fmt:ts:check
      - name: Forge fmt check
        run: pnpm fmt:sol:check

  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge build
        working-directory: packages/contracts
        run: forge build
      - name: Forge test
        working-directory: packages/contracts
        run: forge test -vvv
