# cargo-stylus workspace manifest (required by `cargo stylus check` / `export-abi`
# from v0.10+). The contract key must match the Cargo package name. `path = "."`
# points at this single-contract crate. Networks are left empty — `check` is run
# with an explicit `--endpoint` (local Nitro).
[workspace]
networks = {}

[workspace.contracts.fair-value-oracle]
path = "."
