[project]
name = "inflexion-quant"
version = "0.1.0"
description = "Monte Carlo solvency model for Inflexion PARTIAL mode parameters"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex / Inflexion contributors" }]
license = { text = "MIT" }

dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "tqdm>=4.66",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflexion_quant"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
